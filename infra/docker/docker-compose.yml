services:
  frontend:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.frontend
    container_name: egoudaxyz-frontend
    restart: unless-stopped
    environment:
      - ORIGIN=${ORIGIN:-https://egouda.xyz}
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - internal

networks:
  internal:
    driver: bridge
